name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        working-directory: desktop
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/target/release/PepoMote.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libasound2-dev libudev-dev file wget
      - name: Build (release)
        working-directory: desktop
        run: cargo build --release
      - name: AppImage
        run: bash packaging/linux/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/PepoMote-x86_64.AppImage

  mobile:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev file wget
      - name: Build (release)
        working-directory: mobile-linux
        run: cargo build --release
      - name: AppImage
        run: bash packaging/linux-mobile/appimage.sh aarch64
      - name: Debian package (Mobian)
        run: bash packaging/linux-mobile/deb.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: |
            dist/PepoMote-Mobile-aarch64.AppImage
            dist/pepomote-mobile*arm64.deb

  mobile_musl:
    runs-on: ubuntu-24.04-arm
    # Un fallo del binario musl (postmarketOS) no debe bloquear la release entera
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build in Alpine (musl)
        run: |
          # El rust empaquetado en Alpine va por detrás del MSRV de varios crates del
          # lockfile: rustup stable dentro del contenedor (host aarch64-unknown-linux-musl)
          docker run --rm -v "$PWD:/src" -w /src/mobile-linux alpine:3.22 sh -c '
            set -e
            apk add --no-cache build-base curl
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
            # DINÁMICO: el musl estático (por defecto en Rust) no puede hacer dlopen
            # y winit carga libwayland-client/libEGL así → la app moría al arrancar
            export RUSTFLAGS="-C target-feature=-crt-static"
            cargo build --release'
      - name: Tarball
        run: bash packaging/linux-mobile/tarball.sh aarch64-musl
      - uses: actions/upload-artifact@v4
        with:
          name: mobile_musl
          path: dist/PepoMote-Mobile-aarch64-musl.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Restore keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secret KEYSTORE_B64 (ver docs/RELEASE.md)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/pepomote.jks
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: pepomote.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk PepoMote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PepoMote.apk

  ios:
    runs-on: macos-15
    # IPA sin firmar (AltStore / Sideloadly lo firman con el Apple ID de quien lo
    # instala). Un fallo en macOS no debe bloquear la release del resto.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Xcode + XcodeGen
        run: |
          latest="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          brew install xcodegen
      - name: IPA sin firmar
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild build -project PepoMote.xcodeproj -scheme PepoMote -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath ../build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          app="$(find ../build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app"
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
          zip -qr ../PepoMote.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: PepoMote.ipa

  publish:
    needs: [windows, linux, mobile, mobile_musl, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          sha256sum PepoMote.exe PepoMote-x86_64.AppImage PepoMote.apk \
            PepoMote-Mobile-aarch64.AppImage $(ls pepomote-mobile*arm64.deb PepoMote-Mobile-aarch64-musl.tar.gz PepoMote.ipa 2>/dev/null) > SHA256SUMS.txt
      # Fuente de AltStore: apuntando al IPA de esta release (tamaño real). Se
      # añade en AltStore por su URL estable: .../releases/latest/download/altstore.json
      - name: altstore.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os
          ipa = "PepoMote.ipa"
          if not os.path.exists(ipa):
              print("sin IPA: sin fuente de AltStore"); raise SystemExit(0)
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          base = f"https://github.com/{repo}"
          raw = f"https://raw.githubusercontent.com/{repo}/main"
          version = tag.lstrip("v")
          today = datetime.date.today().isoformat()
          notes = f"PepoMote {version} para iPhone y iPad: puntero, mando de Wii para Dolphin, GamePad de Wii U para Cemu (con doble pantalla) y Nunchuk. Notas completas: {base}/releases/tag/{tag}"
          src = {
              "name": "PepoTech",
              "identifier": "dev.pepotech.altstore",
              "subtitle": "PepoMote: tu iPhone o iPad, mando de tu PC",
              "description": "Fuente oficial de PepoMote para AltStore. Codigo abierto (GPL-3.0).",
              "iconURL": f"{raw}/assets/brand/logo.png",
              "headerURL": f"{raw}/assets/brand/logo.png",
              "website": base,
              "tintColor": "3FA9F5",
              "featuredApps": ["dev.pepotech.pepomote"],
              "apps": [{
                  "name": "PepoMote",
                  "bundleIdentifier": "dev.pepotech.pepomote",
                  "developerName": "PepoTech",
                  "subtitle": "Tu iPhone o iPad, mando de tu PC",
                  "localizedDescription": "Mueve el cursor del PC como con un mando de Wii, juega a Dolphin con un Wiimote virtual y a Cemu con un GamePad de Wii U con doble pantalla. Necesita el receptor PepoMote en el PC (Windows o Linux).",
                  "iconURL": f"{raw}/assets/brand/logo.png",
                  "tintColor": "3FA9F5",
                  "category": "utilities",
                  "screenshotURLs": [],
                  "versions": [{
                      "version": version,
                      "date": today,
                      "localizedDescription": notes,
                      "downloadURL": f"{base}/releases/download/{tag}/PepoMote.ipa",
                      "size": os.path.getsize(ipa),
                      "minOSVersion": "15.0",
                  }],
                  "appPermissions": {
                      "entitlements": [],
                      "privacy": {
                          "NSCameraUsageDescription": "Para escanear el QR de PepoMote en tu PC.",
                          "NSLocalNetworkUsageDescription": "PepoMote habla con el receptor de tu PC por la red local (Wi-Fi).",
                      },
                  },
              }],
              "news": [],
          }
          json.dump(src, open("altstore.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(open("altstore.json", encoding="utf-8").read())
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PepoMote.exe
            PepoMote-x86_64.AppImage
            PepoMote.apk
            PepoMote-Mobile-aarch64.AppImage
            pepomote-mobile*arm64.deb
            PepoMote-Mobile-aarch64-musl.tar.gz
            PepoMote.ipa
            altstore.json
            SHA256SUMS.txt
          generate_release_notes: true
