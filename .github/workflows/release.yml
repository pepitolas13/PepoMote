name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        working-directory: desktop
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/target/release/PepoMote.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libasound2-dev libudev-dev file wget
      - name: Build (release)
        working-directory: desktop
        run: cargo build --release
      - name: AppImage
        run: bash packaging/linux/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/PepoMote-x86_64.AppImage

  mobile:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev file wget
      - name: Build (release)
        working-directory: mobile-linux
        run: cargo build --release
      - name: AppImage
        run: bash packaging/linux-mobile/appimage.sh aarch64
      - name: Debian package (Mobian)
        run: bash packaging/linux-mobile/deb.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: |
            dist/PepoMote-Mobile-aarch64.AppImage
            dist/pepomote-mobile_*_arm64.deb

  mobile_musl:
    runs-on: ubuntu-24.04-arm
    # Un fallo del binario musl (postmarketOS) no debe bloquear la release entera
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build in Alpine (musl)
        run: |
          # El rust empaquetado en Alpine va por detrás del MSRV de varios crates del
          # lockfile: rustup stable dentro del contenedor (host aarch64-unknown-linux-musl)
          docker run --rm -v "$PWD:/src" -w /src/mobile-linux alpine:3.22 sh -c '
            set -e
            apk add --no-cache build-base curl
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo build --release'
      - name: Tarball
        run: bash packaging/linux-mobile/tarball.sh aarch64-musl
      - uses: actions/upload-artifact@v4
        with:
          name: mobile_musl
          path: dist/PepoMote-Mobile-aarch64-musl.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Restore keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secret KEYSTORE_B64 (ver docs/RELEASE.md)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/pepomote.jks
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: pepomote.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk PepoMote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PepoMote.apk

  publish:
    needs: [windows, linux, mobile, mobile_musl, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          sha256sum PepoMote.exe PepoMote-x86_64.AppImage PepoMote.apk \
            PepoMote-Mobile-aarch64.AppImage $(ls pepomote-mobile_*_arm64.deb PepoMote-Mobile-aarch64-musl.tar.gz 2>/dev/null) > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PepoMote.exe
            PepoMote-x86_64.AppImage
            PepoMote.apk
            PepoMote-Mobile-aarch64.AppImage
            pepomote-mobile_*_arm64.deb
            PepoMote-Mobile-aarch64-musl.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
