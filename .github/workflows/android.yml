name: android

on:
  push:
    branches: [main, next]
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/**"]
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Tests, lint y APK debug
        working-directory: android
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintRelease assembleDebug --no-daemon
      # La firma release se activa en h5 con los secrets:
      # KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: PepoMote-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
