[package]
name = "pepomote"
version = "1.3.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PepoMote receiver — turns your Android phone into a Wii-style pointer/controller for your PC"
repository = "https://github.com/PepoTech/PepoMote"

[[bin]]
name = "PepoMote"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
pmp = { path = "../pmp" }
eframe = "0.29"
egui = "0.29"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.11"
crc32fast = "1"
rodio = { version = "0.19", default-features = false }
jpeg-encoder = "0.6"
fast_image_resize = "5"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
] }
windows-capture = "2.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
# Disposición de monitores en Wayland (xdg-output): el ratón absoluto de
# uinput cubre TODO el escritorio y hay que mapearlo a la pantalla de juego
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
x11rb = { version = "0.13", features = ["composite"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
