[package]
name = "pepomote"
version = "1.5.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PepoMote receiver — turns your Android phone into a Wii-style pointer/controller for your PC"
repository = "https://github.com/pepitolas13/PepoMote"

[[bin]]
name = "PepoMote"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
pmp = { path = "../pmp" }
eframe = "0.29"
egui = "0.29"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.11"
crc32fast = "1"
rodio = { version = "0.19", default-features = false }
jpeg-encoder = "0.6"
fast_image_resize = "5"
# Aviso de versión nueva: un HEAD a GitHub una vez al día (rustls, sin
# depender del TLS del sistema; nada de aws-lc, que necesita cmake)
ureq = { version = "2", default-features = false, features = ["tls"] }
# Abrir la página de la release desde el menú de la bandeja (hilo sin egui)
webbrowser = "1"

# Icono de bandeja (Windows) / de la barra de menús (macOS)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Console",
] }
windows-capture = "2.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
# Disposición de monitores en Wayland (xdg-output): el ratón absoluto de
# uinput cubre TODO el escritorio y hay que mapearlo a la pantalla de juego
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
# Inyección sin permisos en compositores wlroots (Sway, Hyprland, MangoWC,
# river, labwc, niri): puntero virtual (wlr-virtual-pointer) y teclado
# virtual (virtual-keyboard-unstable-v1). GNOME/KDE no los ofrecen: uinput.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["composite"] }

# macOS (Apple Silicon): CGEvent para inyectar ratón y teclado, CGDisplay
# para los monitores, CGWindowList para capturar la GamePad View de Cemu;
# AppKit para las teclas multimedia, el Dock y la ventana; la cola principal
# (dispatch) para tocar AppKit desde otros hilos. Mismas versiones que winit
# 0.30 (objc2 0.5 / app-kit 0.2): sin duplicar objc2.
[target.'cfg(target_os = "macos")'.dependencies]
# highsierra: la rueda (CGEventCreateScrollWheelEvent) va tras esa feature
core-graphics = { version = "0.23", features = ["highsierra"] }
core-foundation = "0.9"
# El trait ForeignType de core-graphics (as_ptr de CGImage)
foreign-types = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSEvent",
    "NSGraphicsContext",
    "NSApplication",
    "NSResponder",
    "NSWindow",
    "NSRunningApplication",
] }
objc2-foundation = { version = "0.2", features = ["NSThread", "NSArray", "NSString", "NSGeometry"] }
dispatch2 = "0.3"
libc = "0.2"

# Sin `panic = "abort"`: un pánico en un hilo secundario (el audio de cpal
# con ciertos drivers, por ejemplo) desenrolla ese hilo y el receptor sigue;
# el hook de log.rs lo deja en receptor.log con archivo:línea.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
