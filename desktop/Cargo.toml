[package]
name = "pepomote"
version = "1.13.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PepoMote receiver — turns your Android phone into a Wii-style pointer/controller for your PC"
repository = "https://github.com/pepitolas13/PepoMote"

[[bin]]
name = "PepoMote"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
pmp = { path = "../pmp" }
# eframe sin accesskit en Linux (lector de pantalla por AT-SPI/zbus: unos 60
# crates, dos hilos y una fuente de pánicos en sesiones sin bus); Windows y
# macOS lo conservan más abajo. winit directo: el backend forzado de
# launch.rs (X11 con Wayland roto) y sus features por defecto (CSD en
# Wayland, rwh_06), que eframe solo activaba con sus defaults.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
winit = "0.30"
egui = "0.29"
# El `log` de eframe/winit/glutin (errores de la ventana) va a receptor.log
# por el puente de log.rs; renombrado porque el módulo propio se llama log
logfacade = { package = "log", version = "0.4" }
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
mdns-sd = "0.11"
crc32fast = "1"
rodio = { version = "0.19", default-features = false }
jpeg-encoder = "0.6"
fast_image_resize = "5"
# Aviso de versión nueva: manifiesto verificado de GitHub cada hora (rustls, sin
# depender del TLS del sistema; nada de aws-lc, que necesita cmake)
ureq = { version = "2", default-features = false, features = ["tls"] }
# Icono de bandeja (Windows) / de la barra de menús (macOS)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"

# accesskit (lector de pantalla) solo fuera de Linux: ahí no cambia nada
[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.29", features = ["accesskit"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Console",
    # Para saber en qué hueco de XInput ha caído cada mando virtual
    # (rumble/windows.rs): el driver no lo dice bien.
    "Win32_UI_Input_XboxController",
    # ShellExecuteEx con `runas`: el instalador embebido del driver del mando
    # virtual se lanza elevado (rumble/vigem_setup.rs).
    "Win32_UI_Shell",
] }
windows-capture = "2.0.1"
# Mando virtual Xbox 360 (driver ViGEmBus) por el que Dolphin, Cemu y
# RetroArch mandan la vibracion que luego viaja al movil (rumble/windows.rs).
# Rust puro: habla con el driver por IOCTL, sin DLL.
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
libc = "0.2"
# Disposición de monitores en Wayland (xdg-output): el ratón absoluto de
# uinput cubre TODO el escritorio y hay que mapearlo a la pantalla de juego
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
# Inyección sin permisos en compositores wlroots (Sway, Hyprland, MangoWC,
# river, labwc, niri): puntero virtual (wlr-virtual-pointer) y teclado
# virtual (virtual-keyboard-unstable-v1). GNOME/KDE no los ofrecen: uinput.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# `xtest` (Rust puro, sin bibliotecas nuevas): texto con cualquier carácter
# en X11, remapeando un keycode libre. Ver input/linux_x11_text.rs
x11rb = { version = "0.13", features = ["composite", "xtest"] }

# macOS (Apple Silicon): CGEvent para inyectar ratón y teclado, CGDisplay
# para los monitores, CGWindowList para capturar la GamePad View de Cemu;
# AppKit para las teclas multimedia, el Dock y la ventana; la cola principal
# (dispatch) para tocar AppKit desde otros hilos. Mismas versiones que winit
# 0.30 (objc2 0.5 / app-kit 0.2): sin duplicar objc2.
[target.'cfg(target_os = "macos")'.dependencies]
# highsierra: la rueda (CGEventCreateScrollWheelEvent) va tras esa feature
core-graphics = { version = "0.23", features = ["highsierra"] }
core-foundation = "0.9"
# El trait ForeignType de core-graphics (as_ptr de CGImage)
foreign-types = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "libc",
    "NSEvent",
    "NSGraphicsContext",
    "NSApplication",
    "NSResponder",
    "NSWindow",
    "NSRunningApplication",
] }
objc2-foundation = { version = "0.2", features = ["NSThread", "NSArray", "NSString", "NSGeometry"] }
dispatch2 = "0.3"
libc = "0.2"

# Sin `panic = "abort"`: un pánico en un hilo secundario (el audio de cpal
# con ciertos drivers, por ejemplo) desenrolla ese hilo y el receptor sigue;
# el hook de log.rs lo deja en receptor.log con archivo:línea.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
