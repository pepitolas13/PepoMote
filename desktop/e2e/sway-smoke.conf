# Sway sin cabeza para la prueba de humo de la ventana del receptor
# (desktop/e2e/smoke_gui.sh): solo una salida virtual; la ventana de PepoMote
# tiene que aparecer en el árbol (swaymsg -t get_tree, app_id "PepoMote").
xwayland disable
default_border none
default_floating_border none
output HEADLESS-1 resolution 1280x720 position 0 0
