# Sway sin cabeza para el e2e del receptor (desktop/e2e/e2e_wayland.sh).
# wev (visor de eventos Wayland) a pantalla completa: sus eventos
# wl_pointer/wl_keyboard son lo que se comprueba.
xwayland disable
default_border none
default_floating_border none
focus_follows_mouse yes
output HEADLESS-1 resolution 1280x720 position 0 0
for_window [app_id="wev"] fullscreen enable, focus
# stdbuf: wev no vacía stdout al ir a un archivo (sin él el log llega vacío)
exec mkdir -p /tmp/pepomote-e2e && exec stdbuf -oL wev > /tmp/pepomote-e2e/wev.log 2>&1
