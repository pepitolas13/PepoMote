# Flatpak del emisor PepoMote para Linux móvil: "un botón" en postmarketOS,
# Mobian y cualquier distro con tienda (GNOME Software / Discover). El
# binario ya viene compilado (glibc, runner ARM); aquí solo se empaqueta.
app-id: dev.pepotech.PepoMote
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: PepoMote-Mobile
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # red local: descubrimiento por broadcast y el enlace con el receptor
  - --share=network
  # /sys/bus/iio ya es visible (solo lectura) dentro del sandbox: los
  # valores _raw del IMU se leen; subir la frecuencia queda para el .deb
modules:
  - name: pepomote-mobile
    buildsystem: simple
    build-commands:
      - install -Dm755 PepoMote-Mobile /app/bin/PepoMote-Mobile
      - install -Dm644 dev.pepotech.PepoMote.desktop /app/share/applications/dev.pepotech.PepoMote.desktop
      - install -Dm644 dev.pepotech.PepoMote.png /app/share/icons/hicolor/256x256/apps/dev.pepotech.PepoMote.png
      - install -Dm644 dev.pepotech.PepoMote.metainfo.xml /app/share/metainfo/dev.pepotech.PepoMote.metainfo.xml
    sources:
      - type: file
        path: ../../../mobile-linux/target/release/PepoMote-Mobile
      - type: file
        path: ../dev.pepotech.PepoMote.desktop
      - type: file
        path: ../../linux/pepomote.png
        dest-filename: dev.pepotech.PepoMote.png
      - type: file
        path: dev.pepotech.PepoMote.metainfo.xml
